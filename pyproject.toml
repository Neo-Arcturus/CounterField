[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "creative-agent"
version = "0.1.0"
description = "Production-grade Quality-Diversity (QD) Ideation & Brainstorming Harness"
authors = [{ name = "Northroom" }]
dependencies = [
    "networkx>=3.0",
    "pydantic>=2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
